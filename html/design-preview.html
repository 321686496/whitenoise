   L0 基础色板(--p-*) → L1 语义(--app-*) → L2 组件(风格覆写)

/* ---------- 静态基础 ---------- */
:root{
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px;

}

/* ---------- L2 组件 token：UI 风格覆写 ---------- */
:root[data-ui="flat"]{
  --app-surface:var(--p-surface); --app-surface-2:var(--p-surface-2); --app-line:var(--p-line);
  --app-blur:0px;
  --app-sh-1:0 1px 2px rgba(var(--p-scrim),.06);
  --app-sh-2:0 4px 12px rgba(var(--p-scrim),.07), 0 1px 3px rgba(var(--p-scrim),.05);
  --app-sh-3:0 12px 28px rgba(var(--p-scrim),.10), 0 2px 6px rgba(var(--p-scrim),.06);
  --app-sh-4:0 20px 48px rgba(var(--p-scrim),.18);
  --app-inset:none;
}
:root[data-ui="glass"]{
  --app-surface:var(--p-glass); --app-surface-2:var(--p-glass); --app-line:var(--p-glass-line);
  --app-blur:20px;
  --app-sh-1:0 2px 8px rgba(var(--p-scrim),.06);
  --app-sh-2:0 8px 26px rgba(var(--p-scrim),.10);
  --app-sh-3:0 14px 38px rgba(var(--p-scrim),.14);
  --app-sh-4:0 24px 56px rgba(var(--p-scrim),.20);
  --app-inset:inset 0 1px 0 var(--p-hl);
}
:root[data-ui="neu"]{
  --app-surface:var(--p-bg); --app-surface-2:var(--p-bg); --app-line:transparent;
  --app-blur:0px;
  --app-sh-1:3px 3px 8px var(--p-neu-a), -3px -3px 8px var(--p-neu-b);
  --app-sh-2:7px 7px 16px var(--p-neu-a), -7px -7px 18px var(--p-neu-b);
  --app-sh-3:12px 12px 26px var(--p-neu-a), -10px -10px 24px var(--p-neu-b);
  --app-sh-4:18px 18px 38px var(--p-neu-a), -14px -14px 32px var(--p-neu-b);
  --app-inset:none;
}

/* ---------- L1 语义 token ---------- */
:root{
  --app-bg:var(--p-bg); --app-bg-grad:var(--p-bg-grad);
  --app-text:var(--p-t1); --app-text-2:var(--p-t2); --app-text-3:var(--p-t3);
  --app-line:var(--p-line); --app-line-strong:var(--p-line-strong);
  --app-primary:var(--p-primary); --app-primary-strong:var(--p-primary-strong);
  --app-on-primary:var(--p-on-primary); --app-accent:var(--p-accent);
  --app-primary-soft:color-mix(in srgb, var(--p-primary) 14%, transparent);
  --app-primary-soft-2:color-mix(in srgb, var(--p-primary) 24%, transparent);
  --app-overlay:var(--p-overlay); --app-sunken:var(--p-sunken);
  --app-danger:var(--p-danger); --app-success:var(--p-success); --app-warning:var(--p-warning);
  --app-danger-soft:color-mix(in srgb, var(--p-danger) 13%, transparent);
  --app-rank-1:linear-gradient(135deg,#F0C27F,#E8A849);
  --app-rank-2:linear-gradient(135deg,#C0C7CF,#9EA8B3);
  --app-rank-3:linear-gradient(135deg,#D4A373,#BC8A5F);
}

/* ---------- Reset ---------- */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#ECECEC;color:#1A1A1A;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--app-primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* 图标 */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-f{fill:currentColor;stroke:none}

/* ============================================================
   控制台（左侧）
   ============================================================ */
.shell{display:flex;height:100vh;overflow:hidden}
.console{width:272px;flex:none;background:#FBFBFA;border-right:1px solid #E4E4E2;overflow-y:auto;padding:20px 16px 40px}
.console h1{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.console h1 img{width:26px;height:26px;border-radius:7px}
.console .sub{font-size:11.5px;color:#8A8A85;margin:4px 0 18px;letter-spacing:.02em}
.grp{margin-bottom:18px}
.grp-t{font-size:11px;font-weight:700;color:#A0A09A;letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.opt-row{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:7px 11px;border-radius:9px;background:#F1F1EF;font-size:12.5px;color:#5A5A55;font-weight:500;transition:all var(--dur-fast) var(--ease-std);border:1px solid transparent}
.opt:hover{background:#E9E9E6}
.opt.on{background:#2C3B35;color:#fff;font-weight:600}
.scheme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc{padding:8px 6px;border-radius:10px;background:#F1F1EF;border:1px solid transparent;text-align:center;transition:all var(--dur-fast) var(--ease-std)}
.sc:hover{background:#E9E9E6}
.sc.on{border-color:#2C3B35;background:#fff}
.sc .dots{display:flex;justify-content:center;gap:3px;margin-bottom:5px}
.sc .dots i{width:9px;height:9px;border-radius:50%;display:block}
.sc span{font-size:11.5px;color:#5A5A55;font-weight:500}
.sc.on span{color:#22302A;font-weight:700}
.navlist{display:flex;flex-direction:column;gap:1px}
.navlist button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13px;color:#4A4A45;text-align:left;transition:all var(--dur-fast)}
.navlist button:hover{background:#F1F1EF}
.navlist button.on{background:#2C3B35;color:#fff;font-weight:600}
.navlist .idx{font-size:10.5px;color:#B0B0AA;width:16px;flex:none;font-variant-numeric:tabular-nums}
.navlist button.on .idx{color:rgba(255,255,255,.6)}
.navlist .sec{font-size:10.5px;color:#AEAEA8;letter-spacing:.08em;font-weight:700;padding:12px 10px 5px;text-transform:uppercase}

/* ---------- 舞台 ---------- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1000px 600px at 50% 0%, #F6F6F4 0%, #E7E7E5 100%);overflow:auto;padding:32px}
.phone{width:390px;height:844px;flex:none;border-radius:52px;background:#0A0A0A;padding:11px;
  box-shadow:0 40px 90px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.06);position:relative}
.phone::after{content:'';position:absolute;left:50%;top:22px;transform:translateX(-50%);width:112px;height:30px;
  background:#0A0A0A;border-radius:999px;z-index:60;pointer-events:none}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;
  background:var(--app-bg);color:var(--app-text);font-family:var(--font);transition:background var(--dur-base),color var(--dur-base)}
.hint{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font-size:11.5px;color:#9A9A94;white-space:nowrap}

/* ============================================================
   屏幕通用
   ============================================================ */
.scr{position:absolute;inset:0;overflow:hidden}
.scr-bg{position:absolute;left:0;top:0;right:0;height:300px;pointer-events:none;
  background:linear-gradient(180deg,var(--app-bg-grad) 0%,var(--app-bg) 72%,transparent 100%);z-index:0}
.body{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;padding-bottom:0;
  animation:pageIn var(--dur-page) var(--ease-out) both}
.body::-webkit-scrollbar{width:0}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.body.pt{padding-top:44px}
.body.pt-nav{padding-top:92px}
.body.pb-tab{padding-bottom:calc(var(--tab-h) + 12px)}
.body.pb-mini{padding-bottom:calc(var(--tab-h) + var(--mini-h) + 8px)}
.body.pb-act{padding-bottom:100px}
.body.pb-act-lg{padding-bottom:160px}
.pad{padding-left:20px;padding-right:20px}

/* 状态栏 */
.sbar{position:absolute;left:0;right:0;top:0;height:44px;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;color:var(--app-text);pointer-events:none;font-variant-numeric:tabular-nums}
.sbar .rt{display:flex;align-items:center;gap:5px}
.sbar .rt i{display:block;background:currentColor;border-radius:1px}
/* 导航栏 */
.navbar{position:absolute;left:0;right:0;top:44px;height:48px;z-index:29;display:flex;align-items:center;
  padding:0 12px;gap:4px}
.navbar .nb{flex:1;font-size:16.5px;font-weight:700;letter-spacing:-.01em;text-align:center;color:var(--app-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbar .side{width:64px;display:flex;align-items:center;gap:2px}
.navbar .side.r{justify-content:flex-end}

/* 卡片 / 通用 */
.card{background:var(--app-surface);border:1px solid var(--app-line);border-radius:var(--r-lg);
  box-shadow:var(--app-sh-1),var(--app-inset);backdrop-filter:blur(var(--app-blur));-webkit-backdrop-filter:blur(var(--app-blur))}
.card-2{box-shadow:var(--app-sh-2),var(--app-inset)}
.card-3{box-shadow:var(--app-sh-3),var(--app-inset)}
.cp{padding:16px}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.f1{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt28{margin-top:28px}.mt32{margin-top:32px}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--app-text-2);text-transform:none}
.t1{font-size:24px;font-weight:700;line-height:1.22;letter-spacing:-.02em;color:var(--app-text)}
.t2{font-size:19px;font-weight:600;line-height:1.3;letter-spacing:-.01em;color:var(--app-text)}
.t3{font-size:16px;font-weight:600;line-height:1.38;color:var(--app-text)}
.bd{font-size:15px;line-height:1.55;color:var(--app-text)}
.sm{font-size:13px;line-height:1.5;color:var(--app-text-2)}
.cap{font-size:12px;line-height:1.4;color:var(--app-text-3);font-weight:500}
.muted{color:var(--app-text-2)}.faint{color:var(--app-text-3)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--app-line)}

.btn{height:48px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15.5px;font-weight:600;transition:transform var(--dur-fast) var(--ease-std),background var(--dur-fast)}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--app-primary);color:var(--app-on-primary);box-shadow:0 8px 20px color-mix(in srgb,var(--app-primary) 32%,transparent)}
.btn-gho{background:var(--app-surface-2);color:var(--app-text);border:1px solid var(--app-line)}
.btn-soft{background:var(--app-primary-soft);color:var(--app-primary)}
.btn-danger{background:var(--app-danger-soft);color:var(--app-danger)}
.ibtn{width:44px;height:44px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  color:var(--app-text);transition:transform var(--dur-fast) var(--ease-std),background var(--dur-fast)}
.ibtn:active{transform:scale(.9)}
.ibtn.sq{background:var(--app-surface);border:1px solid var(--app-line);box-shadow:var(--app-sh-1),var(--app-inset)}
.ibtn.rd{border-radius:var(--r-full)}

.seg{display:flex;gap:2px;padding:4px;background:var(--app-surface-2);border-radius:var(--r-full);
  border:1px solid var(--app-line)}
.seg.ghost{background:transparent;border:none;padding:0;gap:8px}
.seg-i{flex:1;height:34px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:var(--r-full);
  font-size:13.5px;font-weight:500;color:var(--app-text-2);transition:all var(--dur-base) var(--ease-std)}
.seg-i.on{background:var(--app-surface);color:var(--app-primary);font-weight:700;box-shadow:var(--app-sh-1)}
.seg.ghost .seg-i{height:32px;padding:0 14px;flex:none;border:1px solid var(--app-line);background:var(--app-surface)}
.seg.ghost .seg-i.on{background:var(--app-primary);border-color:var(--app-primary);color:var(--app-on-primary);box-shadow:0 4px 12px color-mix(in srgb,var(--app-primary) 28%,transparent)}

.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:var(--r-full);
  background:var(--app-surface-2);border:1px solid var(--app-line);font-size:12.5px;font-weight:500;color:var(--app-text-2)}
.chip.on{background:var(--app-primary-soft);border-color:color-mix(in srgb,var(--app-primary) 30%,transparent);color:var(--app-primary);font-weight:700}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em}
.tag.pri{background:var(--app-primary-soft);color:var(--app-primary)}
.tag.ok{background:color-mix(in srgb,var(--app-success) 16%,transparent);color:var(--app-success)}
.tag.warm{background:color-mix(in srgb,var(--app-warning) 16%,transparent);color:var(--app-warning)}
.tag.gh{background:rgba(255,255,255,.22);color:#fff}
.tag.dark{background:var(--app-surface-2);color:var(--app-text-2)}

.icwrap{width:44px;height:44px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex:none}
.icwrap.sm{width:34px;height:34px;border-radius:11px}
.icwrap.lg{width:56px;height:56px;border-radius:18px}
.icwrap.xl{width:72px;height:72px;border-radius:24px}
.icwrap.soft{background:var(--app-primary-soft);color:var(--app-primary)}
.icwrap.flat{background:var(--app-surface-2);color:var(--app-text-2)}

.bar{height:6px;border-radius:var(--r-full);background:var(--app-sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--app-primary),var(--app-accent))}

/* 波形 */
.wave{display:flex;align-items:flex-end;gap:4px;height:26px}
.wave i{width:4px;border-radius:2px;background:var(--app-text-3);opacity:.55}
.wave.lg{height:40px;gap:6px}.wave.lg i{width:5px}
.wave.on i{background:currentColor;opacity:1;animation:wv 1.6s ease-in-out infinite}
.wave.lg.on i{animation-duration:1.6s}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.25)}}

/* 底部固定区 */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:0 16px 10px;pointer-events:none}
.dock>*{pointer-events:auto}
.tabbar{height:var(--tab-h);border-radius:var(--r-full);display:flex;align-items:center;padding:4px 6px;
  background:var(--app-surface);border:1px solid var(--app-line);box-shadow:var(--app-sh-3),var(--app-inset);
  backdrop-filter:blur(var(--app-blur));-webkit-backdrop-filter:blur(var(--app-blur))}
.tab{flex:1;height:100%;border-radius:var(--r-full);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--app-text-3);transition:all var(--dur-base) var(--ease-std);position:relative;min-width:44px}
.tab.on{color:var(--app-primary);background:var(--app-primary-soft)}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.tab.on span{font-weight:700}
.tab .dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--app-primary);opacity:0;transition:opacity var(--dur-base)}
.tab.on .dot{opacity:1}
.mini{height:var(--mini-h);border-radius:var(--r-lg);display:flex;align-items:center;gap:12px;padding:0 12px;margin-bottom:8px;
  background:var(--app-surface);border:1px solid var(--app-line);box-shadow:var(--app-sh-2),var(--app-inset);
  backdrop-filter:blur(var(--app-blur));-webkit-backdrop-filter:blur(var(--app-blur))}
.mini .thumb{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;background:var(--app-surface-2)}
.mini .thumb img{width:100%;height:100%;object-fit:cover}
.play-main{width:44px;height:44px;border-radius:50%;background:var(--app-primary);color:var(--app-on-primary);
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--app-primary) 36%,transparent);
  transition:transform var(--dur-fast) var(--ease-std)}
.play-main:active{transform:scale(.9)}

/* 遮罩 / sheet / dialog */
.ovl{position:absolute;inset:0;background:var(--app-overlay);z-index:50;display:flex;align-items:flex-end;
  animation:fade var(--dur-base) var(--ease-out) both;backdrop-filter:blur(2px)}
.ovl.ctr{align-items:center;justify-content:center;padding:32px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 20px 24px;
  background:var(--app-surface);border:1px solid var(--app-line);border-bottom:none;
  box-shadow:var(--app-sh-4);backdrop-filter:blur(var(--app-blur));-webkit-backdrop-filter:blur(var(--app-blur));
  animation:sheetUp var(--dur-slow) var(--ease-out) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:38px;height:4px;border-radius:2px;background:var(--app-line-strong);margin:6px auto 16px}
.dlg{width:100%;max-width:320px;border-radius:var(--r-xl);padding:22px;
  background:var(--app-surface);border:1px solid var(--app-line);box-shadow:var(--app-sh-4);
  backdrop-filter:blur(var(--app-blur));animation:dlgIn var(--dur-base) var(--ease-out) both}
@keyframes dlgIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.inp{height:46px;background:var(--app-sunken);border:1px solid var(--app-line);border-radius:var(--r-md);
  padding:0 14px;font-size:15px;color:var(--app-text);width:100%;font-family:var(--font)}
.inp::placeholder{color:var(--app-text-3)}

/* 场景卡 */
.scene{border-radius:var(--r-lg);overflow:hidden;position:relative;background:var(--app-surface);
  border:1px solid var(--app-line);box-shadow:var(--app-sh-1),var(--app-inset);transition:transform var(--dur-fast) var(--ease-std)}
.scene:active{transform:scale(.97)}
.scene .cov{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden}
.scene .cov img{width:100%;height:100%;object-fit:cover}
.scene .cov .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55) 100%)}
.scene .nm{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;font-size:15px;font-weight:700;letter-spacing:-.01em;
  text-shadow:0 1px 6px rgba(0,0,0,.35)}
.scene .play{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);
  color:#1A1A1A;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.scene .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.scene.on{border-color:var(--app-primary);box-shadow:0 0 0 2px var(--app-primary-soft-2),var(--app-sh-2)}
.scene-row{display:flex;gap:12px;align-items:center}
.scene-row .cov{width:88px;aspect-ratio:1;border-radius:var(--r-md);flex:none}

/* 声音 */
.snd{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none}
.snd .ci{width:56px;height:56px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center}
.snd .ci.on{box-shadow:0 0 0 2px var(--app-primary)}
.snd-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.snd-row+.snd-row{border-top:1px solid var(--app-line)}

/* 混音轨 */
.trk{display:flex;align-items:center;gap:10px;padding:12px 0}
.trk+.trk{border-top:1px solid var(--app-line)}
.slider{flex:1;height:44px;display:flex;align-items:center}
.slider .rail{width:100%;height:6px;border-radius:var(--r-full);background:var(--app-sunken);position:relative}
.slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);background:var(--trk-c,var(--app-primary))}
.slider .knob{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;
  border:3px solid var(--trk-c,var(--app-primary));transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.18)}

/* 开关 */
.sw{width:51px;height:31px;border-radius:var(--r-full);background:var(--app-sunken);border:1px solid var(--app-line);
  position:relative;transition:all var(--dur-base) var(--ease-std);flex:none}
.sw i{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform var(--dur-base) var(--ease-std)}
.sw.on{background:var(--app-primary);border-color:var(--app-primary)}
.sw.on i{transform:translateX(20px)}

/* 图表 */
.chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:130px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--app-primary),color-mix(in srgb,var(--app-primary) 35%,transparent));min-height:4px}
.chart .b.empty{background:var(--app-sunken)}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 24px;text-align:center}

/* 网格 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4d{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* 单色块（封面降级） */
.cover-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff}
</style>

<script>
/* ================= 数据 ================= */
const SCENES = [
  {id:'deep-sleep',n:'深度睡眠',c:'sleep',d:'雨声铺底、白噪衬静，一夜沉入深眠',ic:'moon',g:'#7E93A8,#4E7182'},
  {id:'rainy-night',n:'夜雨入眠',c:'sleep',d:'细雨夹着篝火，温暖安全地睡去',ic:'rain',g:'#5F7A92,#B97A48'},
  {id:'ocean-sleep',n:'海浪催眠',c:'sleep',d:'潮起潮落，像摇篮一样晃进梦里',ic:'wave-ocean',g:'#5F8296,#4E7182'},
  {id:'focus-white-noise',n:'专注白噪',c:'focus',d:'纯净声墙，一键进入心流',ic:'white-noise',g:'#8296A8,#C49A92'},
  {id:'coffee-time',n:'咖啡时光',c:'focus',d:'杯碟轻响，适合写字的角落',ic:'coffee',g:'#A89068,#9A886B'},
  {id:'long-train',n:'长途列车',c:'focus',d:'车轮规律作响，思绪随轨道延伸',ic:'train',g:'#8E82A6,#746889'},
  {id:'nature-relax',n:'自然放松',c:'relax',d:'把大海和森林搬进房间',ic:'forest',g:'#5F8296,#7E9A74'},
  {id:'forest-meditation',n:'森林冥想',c:'relax',d:'空谷幽林，让呼吸慢下来',ic:'mountain',g:'#7E9A74,#5F7A86'},
  {id:'campfire-night',n:'篝火夜晚',c:'relax',d:'火光噼啪，虫鸣作伴的冬夜',ic:'fire',g:'#B97A48,#9C5F34'},
  {id:'forest-stream',n:'林间溪流',c:'nature',d:'泉水淌过青石，清亮又安定',ic:'stream',g:'#7F9AA6,#66818D'},
  {id:'morning-forest',n:'山野清晨',c:'nature',d:'鸟鸣与风拂过林梢的清晨',ic:'bird',g:'#7E9A74,#547E54'},
];
const CATS=[{k:'all',l:'全部'},{k:'sleep',l:'助眠'},{k:'focus',l:'专注'},{k:'relax',l:'放松'},{k:'nature',l:'自然'}];
const PRESET_C=['#B0BFA8,#8FAF8F','#8296A8,#5F7A92','#6E6290,#8E82A6'];
const SOUNDS=[
  {n:'雨声',ic:'rain',c:'#7E93A8',t:'自然'},{n:'白噪音',ic:'white-noise',c:'#8296A8',t:'噪音'},
  {n:'粉噪音',ic:'pink-noise',c:'#A89068',t:'噪音'},{n:'褐噪音',ic:'brown-noise',c:'#8E82A6',t:'噪音'},
  {n:'细雨',ic:'rain',c:'#7F9AA6',t:'自然'},{n:'雷声',ic:'wave',c:'#5F7A92',t:'自然'},
  {n:'篝火',ic:'fire',c:'#B97A48',t:'生活'},{n:'海浪',ic:'wave-ocean',c:'#5F8296',t:'自然'},
  {n:'森林',ic:'forest',c:'#7E9A74',t:'自然'},{n:'溪流',ic:'stream',c:'#7F9AA6',t:'自然'},
  {n:'鸟鸣',ic:'bird',c:'#8FAF8F',t:'自然'},{n:'虫鸣',ic:'moon',c:'#8E82A6',t:'自然'},
  {n:'咖啡厅',ic:'coffee',c:'#A89068',t:'生活'},{n:'打字机',ic:'edit',c:'#8296A8',t:'生活'},
  {n:'列车',ic:'train',c:'#8E82A6',t:'生活'},{n:'风扇',ic:'fan',c:'#7E93A8',t:'生活'},
];
const IMG='../prototype/src/static/scene/';
const LOGO='../prototype/src/static/logo-v10-1.jpg';

/* ================= 工具 ================= */
const ic=(n,s,cls)=>`<svg class="ic ${cls||''}" ${s?`style="width:${s}px;height:${s}px"`:''}><use href="#i-${n}"/></svg>`;
const grad=(g,deg)=>`linear-gradient(${deg||135}deg,${g.split(',')[0]},${g.split(',')[1]})`;
const cover=(s,h)=>`<div class="cover-ph" style="background:${grad(s.g)};height:${h||'100%'}">${ic(s.ic,44)}</div>`;
const greeting=()=>{const h=new Date().getHours();
  if(h>=6&&h<11)return'早安，新的一天开始了';if(h>=11&&h<14)return'午安，享受片刻宁静';
  if(h>=14&&h<18)return'下午好，放松一下吧';if(h>=18&&h<22)return'晚上好，让声音陪伴你';return'夜深了，安心入眠吧';};

const sbar=()=>`<div class="sbar"><span>21:40</span><span class="rt">
  <i style="width:15px;height:9px;opacity:.9;clip-path:polygon(0 0,80% 0,80% 100%,0 100%,0 0)"></i>
  <i style="width:2px;height:10px"></i><i style="width:2px;height:7px"></i><i style="width:2px;height:5px"></i>
  <i style="width:22px;height:11px;border-radius:3px;opacity:.85"></i></span></div>`;

const navbar=(title,{back=true,right=''}={})=>`
<div class="navbar"><div class="side">${back?`<button class="ibtn" aria-label="返回">${ic('chevron-left',21)}</button>`:''}</div>
<div class="nb">${title}</div><div class="side r">${right}</div></div>`;

const TABS=[{k:'index',l:'首页',i:'wave'},{k:'scene',l:'场景',i:'grid'},{k:'discover',l:'发现',i:'search'},{k:'mine',l:'我的',i:'user'}];
const tabbar=(cur)=>`<div class="tabbar">${TABS.map(t=>`<button class="tab ${t.k===cur?'on':''}">
  ${ic(t.i,22)}<span>${t.l}</span><i class="dot"></i></button>`).join('')}</div>`;

const mini=(s)=>`<div class="mini">
  <div class="thumb"><img src="${IMG}${s.id}.png" alt="" onerror="this.style.display='none';this.parentElement.style.background='${grad(s.g)}'"></div>
  <div class="f1 col" style="gap:2px">
    <div class="t3 ell">${s.n}</div>
    <div class="cap">${s.d.slice(0,14)}…</div>
  </div>
  <button class="ibtn" aria-label="定时">${ic('timer',20)}</button>
  <button class="ibtn" aria-label="混音">${ic('mixer',20)}</button>
  <button class="play-main" aria-label="暂停">${ic('pause',18)}</button>
</div>`;

const dock=(cur,withMini)=>`<div class="dock">${withMini?mini(SCENES[0]):''}${tabbar(cur)}</div>`;

const sceneCard=(s,on)=>`<div class="scene ${on?'on':''}">
  <div class="cov" style="background:${grad(s.g)}">
    <div class="cover-ph" style="position:absolute;inset:0">${ic(s.ic,40)}</div>
    <img src="${IMG}${s.id}.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">
    <div class="grad"></div><div class="nm ell">${s.n}</div>
    <div class="play">${ic('play',15)}</div></div>
  <div class="meta"><div class="cap ell" style="color:var(--app-text-2)">${s.d}</div>
    <div class="cap">${s.c==='sleep'?'助眠':s.c==='focus'?'专注':s.c==='relax'?'放松':'自然'} · 3 音轨</div></div>
</div>`;

const soundIcon=(s,size)=>`<div class="ci" style="background:color-mix(in srgb,${s.c} 18%,var(--app-surface));color:${s.c};${size?`width:${size}px;height:${size}px;border-radius:${size/3.2}px`:''}">${ic(s.ic,size?size*0.45:22)}</div>`;

const seg=(items,active)=>`<div class="seg">${items.map(i=>`<div class="seg-i ${i.k===active?'on':''}">${i.i?ic(i.i,15):''}${i.l}</div>`).join('')}</div>`;

const screen=(inner,{nav,curTab,mini:wm,pb,pt,btm})=>`<div class="scr"><div class="scr-bg"></div>
  <div class="body ${pt||''} ${pb||''}">${inner}</div>
  ${nav||''}${sbar()}${wm&&curTab?dock(curTab,true):curTab?dock(curTab,false):''}${btm||''}</div>`;

const actBar=(inner)=>`<div style="position:absolute;left:0;right:0;bottom:0;z-index:45;padding:12px 20px 20px;
  background:var(--app-surface);border-top:1px solid var(--app-line);
  box-shadow:0 -8px 24px rgba(var(--p-scrim),.08);backdrop-filter:blur(var(--app-blur))">${inner}</div>`;

/* ================= 页面 ================= */
const PAGES={};

/* ---------- 1. 首页：播放优先三层 ---------- */
PAGES['index']={t:'首页 · 播放优先三层',h:'黄金位主控卡直接可播，首屏 1 次点击出声；金刚区降级为一键播 chip',r:()=>screen(`
  <div class="pad" style="padding-top:8px">
    <div class="row" style="justify-content:space-between">
      <div class="row g12">
        <img src="${LOGO}" style="width:44px;height:44px;border-radius:14px;box-shadow:0 6px 16px color-mix(in srgb,var(--app-primary) 26%,transparent)" alt="">
        <div class="col"><div style="font-size:21px;font-weight:700;letter-spacing:.04em">声栖</div>
        <div class="cap">${greeting()}</div></div>
      </div>
      <div class="row g8">
        <button class="ibtn sq" aria-label="主题">${ic('palette',20)}</button>
        <button class="ibtn sq" aria-label="成就">${ic('trophy',20)}</button>
      </div>
    </div>

    <!-- ② 主控卡 -->
    <div class="card card-3 mt20" style="padding:18px;border-radius:var(--r-xl)">
      <div class="row" style="justify-content:space-between">
        <div class="col g4"><div class="t2">夜雨入眠</div><div class="cap">细雨 · 雷声 · 篝火</div></div>
        <span class="tag pri">3 / 6 路</span>
      </div>
      <div class="row mt16" style="justify-content:space-between">
        <div class="wave lg on" style="color:var(--app-primary)">
          ${[18,34,24,40,20].map((h,i)=>`<i style="height:${h}px;animation-delay:${i*.12}s"></i>`).join('')}
        </div>
        <button style="width:88px;height:88px;border-radius:50%;background:var(--app-primary);color:var(--app-on-primary);
          display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px color-mix(in srgb,var(--app-primary) 38%,transparent)"
          aria-label="暂停">${ic('pause',34)}</button>
      </div>
      <div class="row g8 mt16">
        <button class="chip" style="height:38px;border-radius:19px;padding:0 14px">${ic('timer',15)} 定时 30分</button>
        <button class="chip" style="height:38px;border-radius:19px;padding:0 14px">${ic('mixer',15)} 混音</button>
        <button class="chip on" style="height:38px;border-radius:19px;padding:0 14px">${ic('save',15)} 已收藏</button>

    <!-- ③ 场景流 -->
    <div class="mt28 row g8">
      <button class="chip" style="height:34px;padding:0 14px">${ic('moon',14)} 深度睡眠</button>
      <button class="chip" style="height:34px;padding:0 14px">${ic('white-noise',14)} 专注白噪</button>
      <button class="chip" style="height:34px;padding:0 14px">${ic('stream',14)} 林间溪流</button>

    <div style="height:8px"></div>
  </div>`,{curTab:'index',pt:'pt',pb:'pb-tab'})};

/* ---------- 2. 场景 ---------- */
PAGES['scene']={t:'场景',h:'推荐 / 最近 / 精选 / 我的场景，统一自定义导航栏与分类数据源',r:()=>screen(`
  <div class="pad" style="padding-top:8px">
    <div class="row" style="justify-content:space-between">
      <div class="row g12">
        <img src="${LOGO}" style="width:40px;height:40px;border-radius:13px" alt="">
        <div class="col"><div style="font-size:19px;font-weight:700;letter-spacing:.03em">声栖</div>

      <button class="ibtn sq" aria-label="主题">${ic('palette',20)}</button></div>
    </div>

    <div class="card cp mt20">
      <div class="row g8"><div class="icwrap sm soft">${ic('flame',17)}</div><div class="sec-t">为你推荐</div></div>
      <div class="hscroll mt12">
        ${SCENES.slice(0,4).map(s=>`<div style="width:150px;flex:none">
          <div style="height:112px;border-radius:var(--r-md);overflow:hidden;position:relative">
            <img src="${IMG}${s.id}.png" style="width:100%;height:100%;object-fit:cover" alt="" onerror="this.style.display='none'">

          </div>
          <div class="t3 mt8 ell">${s.n}</div><div class="cap ell2" style="height:34px">${s.d}</div></div>`).join('')}
      </div>
      <div class="hr mt16"></div>
      <div class="row g8 mt16"><div class="icwrap sm flat">${ic('clock',17)}</div><div class="sec-t">最近播放</div></div>
      <div class="hscroll mt12">
        ${SCENES.slice(4,8).map(s=>`<div style="width:104px;flex:none" class="col g8">
          <div class="icwrap xl" style="background:${grad(s.g)};color:#fff">${ic(s.ic,30)}</div>

      </div>

    <div class="card cp mt16">
      <div class="row g8"><div class="icwrap sm soft">${ic('mountain',17)}</div><div class="sec-t f1">精选场景</div>
        <span class="cap" style="color:var(--app-primary)">查看全部 ${ic('chevron-right',13)}</span></div>

      <div class="g2 mt12">${SCENES.slice(0,4).map(s=>sceneCard(s)).join('')}</div>

    <div class="card cp mt16">

        <button class="chip" style="height:30px">${ic('edit',14)} 新建</button></div>
      <div class="scene-row mt12">

        <button class="ibtn" aria-label="播放">${ic('play',19)}</button>
      </div>
    </div>
    <div style="height:8px"></div>

PAGES['scene-all']={t:'全部场景',h:'统一自定义导航栏 + 返回；新增搜索；分类数据源与首页一致',r:()=>screen(`

/* ---------- 4. 场景详情 ---------- */
PAGES['scene-detail']={t:'场景详情',h:'封面出血 + 悬浮返回；底部固定主行动区（播放/编辑/收藏/分享）',r:()=>{

      <div class="card cp mt16">
        <div class="row" style="justify-content:space-between"><div class="sec-t">声音配方</div><span class="cap">总计 100%</span></div>

  </div></div>`)};

PAGES['ov-sheet']={t:'浮层 · 声音详情',h:'声音库点击弹出；元信息表 + 适用场景 + 双行动按钮',r:()=>overlay(`
  <div class="ovl"><div class="sheet">
    <div class="handle"></div>
    <div class="row g16">
      <div style="width:72px;height:72px;border-radius:24px;background:${grad('#5F7A92,#B97A48')};display:flex;align-items:center;justify-content:center;color:#fff;flex:none">${ic('rain',34)}</div>
      <div class="f1 col g4"><div class="t2">雷声</div><span class="tag dark" style="align-self:flex-start">自然</span>
        <div class="cap">远处闷雷，雨夜的安全感</div></div></div>
    <div class="card cp mt16" style="background:var(--app-surface-2);box-shadow:none">
      ${[['时长','03:00'],['采样率','48 kHz'],['音质','无损 FLAC'],['循环片段','无缝'],['来源','实地录制']].map((x,i)=>`
      <div class="row" style="padding:7px 0${i<4?';border-bottom:1px solid var(--app-line)':''}">
        <span class="sm f1">${x[0]}</span><span class="sm num" style="color:var(--app-text)">${x[1]}</span></div>`).join('')}
    </div>
    <div class="sec-t mt20">适用场景</div>
    <div class="row g8 mt12"><span class="chip on">助眠</span><span class="chip on">放松</span><span class="chip">专注</span><span class="chip">阅读</span></div>
    <div class="row g12 mt20"><button class="btn btn-gho f1">${ic('play',17)} 试听</button>
      <button class="btn btn-pri f1">${ic('mixer',17)} 加入混音</button></div>
  </div></div>`)};

PAGES['ov-dialog']={t:'浮层 · 保存场景',h:'居中 Dialog；遮罩 --app-overlay（v1 该变量未定义导致遮罩失效）',r:()=>overlay(`
  <div class="ovl ctr"><div class="dlg">
    <div class="t2" style="text-align:center">保存为场景</div>
    <div class="sm mt8" style="text-align:center">给这套混音起个名字，方便下次一键播放</div>
    <input class="inp mt16" value="我的雨天配方" maxlength="20" placeholder="输入场景名称">
    <div class="row g12 mt16"><button class="btn btn-gho f1">取消</button><button class="btn btn-pri f1">保存</button></div>
  </div></div>`)};

/* ================= 渲染 ================= */
const ORDER=['index','scene','scene-all','scene-detail','scene-edit','library','discover','mine',
  'settings','theme','achievement','checkin','stats','favorites','history','invite','onboarding',
  'ov-timer','ov-mix','ov-sheet','ov-dialog'];
const SCHEMES=[['morandi','莫兰迪',['#3D6B5E','#A3C4B0','#F4F2EC','#C4706B']],['ocean','深海',['#2F7F86','#7FC4C4','#EFF4F5','#9FD4D4']],
  ['forest','森林',['#3F6B34','#8FB071','#F1F4EA','#C0705B']],['sunset','日落',['#B4603C','#E3A377','#FBF3EA','#C15B58']],
  ['lavender','薰衣草',['#6B5A9E','#B3A5CE','#F5F3FA','#C0759B']],['mono','极简',['#2E2E2E','#757575','#F7F7F7','#B1483D']]];

const root=document.documentElement;
let cur='index';

function render(){
  document.getElementById('screen').innerHTML=PAGES[cur].r();
  document.getElementById('hint').textContent=PAGES[cur].h;
}

// 控制台：配色
document.getElementById('schemeGrid').innerHTML=SCHEMES.map(s=>
  `<button class="sc ${s[0]==='morandi'?'on':''}" data-scheme="${s[0]}">
    <span class="dots">${s[2].map(c=>`<i style="background:${c}"></i>`).join('')}</span><span>${s[1]}</span></button>`).join('');

// 控制台：导航
const SEC={index:'主链路',settings:'我的链路',onboarding:'其他','ov-timer':'浮层'};
document.getElementById('navList').innerHTML=ORDER.map((k,i)=>{
  const sec=SEC[k]?`<div class="sec">${SEC[k]}</div>`:'';
  return sec+`<button data-page="${k}" class="${k===cur?'on':''}"><span class="idx">${String(i+1).padStart(2,'0')}</span>${PAGES[k].t}</button>`;
}).join('');

document.getElementById('navList').addEventListener('click',e=>{
  const b=e.target.closest('button[data-page]');if(!b)return;
  cur=b.dataset.page;
  document.querySelectorAll('#navList button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});

function bind(row,attr,fn){
  document.getElementById(row).addEventListener('click',e=>{
    const b=e.target.closest(`[data-${attr}]`);if(!b)return;
    document.querySelectorAll(`#${row} [data-${attr}]`).forEach(x=>x.classList.toggle('on',x===b));
    fn(b.dataset[attr]);render();
  });
}
let manualMode='dark';
bind('schemeGrid','scheme',v=>root.dataset.scheme=v);
bind('uiRow','ui',v=>root.dataset.ui=v);
bind('modeRow','mode',v=>{
  manualMode=v;
  root.dataset.mode = v==='auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : v;
});
// 跟随系统：实时响应
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
  if(manualMode==='auto'){root.dataset.mode=e.matches?'dark':'light';render();}
});
// 键盘翻页
document.addEventListener('keydown',e=>{
  const i=ORDER.indexOf(cur);
  if(e.key==='ArrowDown'&&i<ORDER.length-1){document.querySelector(`[data-page="${ORDER[i+1]}"]`).click()}
  if(e.key==='ArrowUp'&&i>0){document.querySelector(`[data-page="${ORDER[i-1]}"]`).click()}
});

render();
</script>
</body>
</html>
